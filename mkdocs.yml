site_name: SpecificAI Documentation
site_description: SpecificAI Platform documentation
site_url: https://marketplace-specificai.github.io/specificai-platform/
docs_dir: docs

theme:
  name: material
  # Announcement bar override (overrides/main.html). Resolved relative to
  # this file, so the same value works for the private build and for the
  # public repo layout, where transform_content.py stages overrides/ next to
  # the generated mkdocs.yml.
  custom_dir: overrides
  # White logotype: the header renders in the brand navy (see
  # stylesheets/extra.css) and the source logo is near-black. Both variants
  # are generated by tools/marketplace_mirror/generate_logo_variants.py.
  logo: assets/specificai-logo-white.png
  favicon: assets/favicon.png
  palette:
    # primary/accent `custom` defers to the brand variables in
    # stylesheets/extra.css (specific.ai navy #252A5C / blue #1753FF).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  # specific.ai's own face is PP Neue Montreal, a licensed font that cannot
  # be redistributed here; Inter is the closest neutral grotesque on Google
  # Fonts.
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.highlight
    - search.suggest
    - search.share

# The snippet sources are included into the cloud pages, not served as pages of
# their own. This only affects rendering — transform_content.py still copies
# them to the public repo, where that build needs them on disk.
exclude_docs: |
  _snippets/

nav:
  - Home: index.md
  - Requirements:
      - AWS: requirements/aws.md
      - Azure: requirements/azure.md
      - GCP: requirements/gcp.md
  - Registry access: registry-access.md
  - Install guide: install.md
  - Upgrade guide: upgrade.md
  - Helm values:
      - values/index.md
      - Amazon EKS Auto Mode: values/aws-auto-mode.md
      - Amazon EKS with self-managed Karpenter: values/aws-standard.md
      - Azure AKS Automatic: values/azure-automatic.md
      - Azure AKS Standard: values/azure-standard.md
      - Google GKE Autopilot: values/gcp-autopilot.md
      - Google GKE Standard: values/gcp-standard.md
  - Feature availability: features.md
  - Changelog: changelog.md
  - Support: support.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Shared sections (Secrets, Outbound endpoints) live in src/_snippets and are
  # included by every cloud requirements page. base_path is resolved against the
  # working directory, which is the repository root for both builds: this site
  # builds with `mkdocs build -f .devops/docs/customer-facing/mkdocs.yml`, and
  # the public mirror builds the generated copy of this file from its own repo
  # root. Listing both docs roots keeps one config working in both layouts —
  # first match wins, so the private path comes first.
  - pymdownx.snippets:
      base_path:
        - .devops/docs/customer-facing/src
        - docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra:
  latest_release: "4.9.0"
  latest_release_anchor: "490-2026-09-22"
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marketplace-specificai/specificai-platform
      name: SpecificAI on GitHub

copyright: Copyright &copy; SpecificAI
